name = "getchitty"
main = "src/edge/worker.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]

# Production routes (bare `wrangler deploy` applies top-level routes;
# the Workers Builds default-branch trigger deploys without --env)
routes = [
  { pattern = "get.chitty.cc", custom_domain = true }
]

# Workers AI binding
ai = { binding = "AI" }

# AI Search namespace for the central ChittyBrain (Agents, MCPs, Docs)
[[ai_search_namespaces]]
binding = "CHITTY_SEARCH"
namespace = "chitty-ecosystem"

# Workflows
[[workflows]]
name = "approval-workflow"
binding = "APPROVAL_WORKFLOW"
class_name = "ApprovalWorkflow"

# Service binding to agent.chitty.cc
[[services]]
binding = "AGENT_ORCHESTRATOR"
service = "agent-orchestrator"
environment = "production"

# KV namespace for config/sessions
[[kv_namespaces]]
binding = "CHITTY_KV"
id = "${CHITTY_KV_NAMESPACE_ID}"

# R2 bucket for artifacts/uploads
[[r2_buckets]]
binding = "CHITTY_ASSETS"
bucket_name = "${CHITTY_R2_BUCKET}"

# Vectorize index for embeddings/RAG
[[vectorize]]
binding = "CHITTY_VECTORS"
index_name = "${CHITTY_VECTOR_INDEX}"

# Queues for background processing
[[queues.producers]]
binding = "CHITTY_TASKS"
queue = "${CHITTY_TASKS_QUEUE}"

[[queues.consumers]]
queue = "${CHITTY_TASKS_QUEUE}"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "${CHITTY_DLQ_QUEUE}"

# Hyperdrive (Postgres) connection
[[hyperdrive]]
binding = "CHITTY_DB"
id = "${CHITTY_HYPERDRIVE_ID}"

[observability]
enabled = true

# Development environment
[env.dev]

# Staging environment
[env.stage]

# Production environment
# (routes are declared at top level so the bare `wrangler deploy`
# default-branch trigger binds get.chitty.cc to the getchitty worker)
[env.prod]

# Production service binding points to production agent-orchestrator
[[env.prod.services]]
binding = "AGENT_ORCHESTRATOR"
service = "agent-orchestrator"
environment = "production"
